# myblog Nginx 站点配置（阿里云 ECS / Ubuntu 24.04）
# 安装位置：/etc/nginx/sites-available/myblog  ->  软链到 sites-enabled/
#
# 职责：
#   /api/  -> 反向代理到本机 gunicorn (127.0.0.1:5000)
#   其它    -> 直接吐 frontend/dist 静态文件（Vue 用 hash 路由，兜底回 index.html）

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 暂时只用公网 IP 访问；以后绑域名把域名加进来即可
    server_name 47.94.91.5 _;

    root /home/blog/my_blog/frontend/dist;
    index index.html;

    charset utf-8;

    # 主人模式发布文章走 /api/admin/article，正文可能较长
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/wasm;

    # 带指纹的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 3D 虚拟人模型（约 40 MB）与静态图
    location ~* \.(glb|gltf|png|jpg|jpeg|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html 绝不缓存，否则前端更新后访客拿到旧壳
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 聊天要等 DeepSeek 生成，给足超时；不缓冲以便将来上流式输出
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    # 健康检查（后端根路由）
    location = /api/health {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
    }

    # SPA 兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/myblog-access.log;
    error_log  /var/log/nginx/myblog-error.log;
}
